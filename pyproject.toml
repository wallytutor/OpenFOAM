[project]
name = "openfoam"
version = "0.1.0"
description = "OpenFOAM 13"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "jupyter-cache>=1.0.1",
    "nbformat>=5.11.1",
    "notebook>=7.6.3",
    "majordome-build",
    "majordome",
]

[tool.uv.sources.majordome-build]
git = "https://github.com/wallytutor/majordome-build.git"
branch = "main"

[tool.uv.sources.majordome]
git = "https://github.com/wallytutor/python-majordome.git"
branch = "main"
